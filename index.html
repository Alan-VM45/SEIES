<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEIES - Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" href="img/logo.jpeg">
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="login.css">
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <section id="view-login" class="w-full max-w-md">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-slate-100 w-full">
            <div class="flex flex-col items-center gap-4 mb-8">
                <div class="p-2">
                    <img src="img/logo.jpeg" alt="Logo SEIES"
                        class="w-20 h-20 rounded-3xl shadow-lg border-2 border-slate-100">
                </div>
                <h2 class="text-3xl font-black uppercase italic tracking-tighter text-slate-900">Acceso a SEIES</h2>
            </div>

            <div class="space-y-4">
                <input type="email" id="login-email" placeholder="CORREO ELECTRÓNICO"
                    class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none focus:border-indigo-400 text-slate-900">

                <input type="password" id="login-password" placeholder="CONTRASEÑA"
                    class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 font-bold outline-none focus:border-indigo-400 text-slate-900">

                <button onclick="handleLogin()" id="btn-do-login"
                    class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black text-lg shadow-xl hover:scale-[1.01] active:scale-95 transition-all uppercase">
                    Entrar al Sistema
                </button>
            </div>
            <p id="login-error" class="text-center text-[10px] font-bold text-red-600 mt-4 hidden uppercase"></p>
        </div>
    </section>

    <script src="script.js?v=51"></script>
    <script>
        // Inicializar iconos de Lucide específicamente para esta página
        window.addEventListener('load', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>

</html>
